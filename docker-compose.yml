# ChronosDB 3-node cluster.
#
#   docker compose up --build
#
# Client ports on the host: 7001, 7002, 7003 (node 1, 2, 3).
# Peer (Raft) traffic stays on the internal network.
#
# Try it:
#   ./target/debug/chronos put --addrs 1=127.0.0.1:7001,2=127.0.0.1:7002,3=127.0.0.1:7003 hello world
#   ./target/debug/chronos get --addrs 1=127.0.0.1:7001,2=127.0.0.1:7002,3=127.0.0.1:7003 hello

services:
  node1:
    build: .
    command:
      [
        "serve",
        "--id", "1",
        "--client-addr", "0.0.0.0:7001",
        "--peer-addr", "0.0.0.0:7101",
        "--peer", "2=node2:7102",
        "--peer", "3=node3:7103",
        "--data-dir", "/data",
      ]
    ports:
      - "7001:7001"
    volumes:
      - node1-data:/data

  node2:
    build: .
    command:
      [
        "serve",
        "--id", "2",
        "--client-addr", "0.0.0.0:7002",
        "--peer-addr", "0.0.0.0:7102",
        "--peer", "1=node1:7101",
        "--peer", "3=node3:7103",
        "--data-dir", "/data",
      ]
    ports:
      - "7002:7002"
    volumes:
      - node2-data:/data

  node3:
    build: .
    command:
      [
        "serve",
        "--id", "3",
        "--client-addr", "0.0.0.0:7003",
        "--peer-addr", "0.0.0.0:7103",
        "--peer", "1=node1:7101",
        "--peer", "2=node2:7102",
        "--data-dir", "/data",
      ]
    ports:
      - "7003:7003"
    volumes:
      - node3-data:/data

volumes:
  node1-data:
  node2-data:
  node3-data:
